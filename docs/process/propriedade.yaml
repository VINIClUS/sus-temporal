# Propriedade de arquivos por sessão. Checada no CI por scripts/check_ownership.py.
# Padrões fnmatch: "*" também atravessa "/". Arquivo sem dono listado é compartilhado.
versao: 1
# Integradores podem alterar qualquer caminho, exceto os reservados a humanos.
integradores: ["ORQ"]
donos:
  ORQ:
    branches: ["claude/determined-ritchie-b9o2qg", "claude/orq-*"]
    caminhos:
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".gitignore"
      - ".gitattributes"
      - ".github/*"
      - ".claude/*"
      - "scripts/*"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/process/*"
      - "docs/plan/*"
      - "docs/spec/*"
      - "docs/decisions/*"
      - "docs/references/*"
      - "src/sustemporal/__init__.py"
      - "src/sustemporal/cli.py"
      - "src/sustemporal/config.py"
      - "src/sustemporal/yamlio.py"
      - "src/sustemporal/hashing.py"
      - "src/sustemporal/store.py"
      - "src/sustemporal/gates.py"
      - "src/sustemporal/runtime_info.py"
      - "src/sustemporal/log.py"
      - "src/sustemporal/errors.py"
      - "src/sustemporal/duck.py"
      - "src/sustemporal/ingest/__init__.py"
      - "src/sustemporal/ingest/registry.py"
      - "src/sustemporal/contracts/__init__.py"
      - "src/sustemporal/contracts/base.py"
      - "src/sustemporal/contracts/records.py"
      - "src/sustemporal/contracts/config.py"
      - "tests/conftest.py"
      - "tests/*/conftest.py"
      - "tests/fixtures/sintetico/*"
      - "tests/unit/test_contracts.py"
      - "tests/unit/test_limites_codigo.py"
      - "tests/unit/test_check_ownership.py"
      - "tests/unit/test_interfaces.py"
      - "tests/unit/test_cli.py"
  S1:
    branches: ["claude/s1-*"]
    caminhos:
      - "src/sustemporal/contracts/temporal.py"
      - "src/sustemporal/contracts/artifacts.py"
      - "src/sustemporal/acquisition/*"
      - "src/sustemporal/temporal/*"
      - "catalog/sources.yaml"
      - "catalog/policies/*"
      - "config/watch.yaml"
      - "docs/method/temporal.md"
  S2:
    branches: ["claude/s2-*"]
    caminhos:
      - "src/sustemporal/ingest/dbc.py"
      - "src/sustemporal/ingest/dbf.py"
      - "src/sustemporal/ingest/sia_pa.py"
      - "src/sustemporal/evaluation/labels.py"
      - "catalog/layouts/sia_pa.yaml"
      - "catalog/labels/*"
      - "catalog/schemas/sia_pa*.yaml"
      - "tests/fixtures/dbc_encoder.py"
      - "tests/fixtures/dbf_writer.py"
  S3:
    branches: ["claude/s3-*"]
    caminhos:
      - "src/sustemporal/ingest/sigtap.py"
      - "src/sustemporal/ingest/cnes.py"
      - "src/sustemporal/ingest/coverage.py"
      - "src/sustemporal/ingest/territorio.py"
      - "src/sustemporal/ingest/cli.py"
      - "src/sustemporal/reporting/report.py"
      - "src/sustemporal/reporting/cli.py"
      - "catalog/layouts/cnes.yaml"
      - "catalog/layouts/sigtap.yaml"
      - "catalog/schemas/cnes*.yaml"
      - "catalog/schemas/sigtap*.yaml"
      - "catalog/schemas/cobertura.yaml"
      - "catalog/territorio/*"
      - "config/pilot.yaml"
      - "docs/method/observability.md"
      - "docs/runbooks/piloto_local.md"
  S4:
    branches: ["claude/s4-*"]
    caminhos:
      - "src/sustemporal/contracts/rules.py"
      - "src/sustemporal/rules/*"
      - "catalog/rules/*"
      - "catalog/familias.yaml"
      - "catalog/schemas/motor.yaml"
      - "docs/method/model.md"
  S5:
    branches: ["claude/s5-*"]
    caminhos:
      - "src/sustemporal/contracts/experiment.py"
      - "src/sustemporal/contracts/evaluation.py"
      - "src/sustemporal/evaluation/split.py"
      - "src/sustemporal/evaluation/baselines.py"
      - "src/sustemporal/evaluation/features.py"
      - "src/sustemporal/evaluation/metrics.py"
      - "src/sustemporal/evaluation/bootstrap.py"
      - "src/sustemporal/evaluation/freeze.py"
      - "src/sustemporal/evaluation/cli.py"
      - "config/cohort.yaml"
      - "config/splits.yaml"
      - "experiments/frozen/README.md"
  S6:
    branches: ["claude/s6-*"]
    caminhos:
      - "src/sustemporal/contracts/explanation.py"
      - "src/sustemporal/explanation/evidence.py"
      - "src/sustemporal/explanation/prov.py"
      - "src/sustemporal/explanation/explain.py"
      - "src/sustemporal/explanation/cli.py"
      - "src/sustemporal/explanation/templates/*"
      - "src/sustemporal/evaluation/ablation.py"
      - "docs/method/explicacoes.md"
  S7:
    branches: ["claude/s7-*"]
    caminhos:
      - "src/sustemporal/contracts/counterfactual.py"
      - "src/sustemporal/explanation/counterfactual*"
      - "catalog/operations.yaml"
      - "docs/method/contrafactuais.md"
  S8:
    branches: ["claude/s8-*"]
    caminhos:
      - "src/sustemporal/contracts/annotation.py"
      - "src/sustemporal/evaluation/annotation.py"
      - "src/sustemporal/evaluation/annotation_cli.py"
      - "src/sustemporal/evaluation/values.py"
      - "src/sustemporal/evaluation/performance.py"
      - "docs/method/annotation.md"
      - "docs/method/valores.md"
  S9:
    branches: ["claude/s9-*"]
    caminhos:
      - "src/sustemporal/reporting/reproduce.py"
      - "docs/method/claims.md"
      - "docs/runbooks/reproducao.md"
      - "docs/PENDENCIAS.md"
somente_humanos:
  - "experiments/decisions/*.yaml"
excecoes_humanos:
  - "experiments/decisions/MODELO_*.yaml"

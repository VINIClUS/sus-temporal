# Candidata do primeiro incremento (plano §5); escolher as famílias observáveis é decisão do G0.
rule_id: PROC_CBO_SIGTAP
familia: PROCEDIMENTO_CBO
versao: 0.1.0
estado: CANDIDATA_PRE_G0
descricao: >-
  O CBO do registro SIA-PA consta, para o procedimento, em rl_procedimento_ocupacao da versão do
  SIGTAP selecionada pela política temporal. Procedimento sem ocupação listada leva a
  aplicabilidade desconhecida (A_CONFIRMAR); ausência só sustenta violação com cobertura
  DISPONIVEL e integridade OK.
instrumentos: [C, I, P, S, A, B]
condicao_aplicabilidade: instrumento_na_lista_da_regra
unidade_avaliacao: OCORRENCIA
campos_necessarios: [instrumento, procedimento, cbo]
requisitos_fonte:
  - fonte: SIA_PA
    schema_id: sia_pa.v1
    campos: [procedimento, cbo, instrumento, competencia_atendimento, competencia_processamento]
  - fonte: SIGTAP
    schema_id: sigtap_proc_ocupacao.v1
    campos: [dt_competencia, co_procedimento, co_ocupacao]
politica_id: documentada_pendente
criterios_temporais: []
referencia:
  doc_id: O12
  titulo: SIGTAP, membros do zip da Tabela Unificada
  localizador: >-
    rl_procedimento_ocupacao.txt e rl_procedimento_ocupacao_layout.txt em
    TabelaUnificada_{AAAAMM}_v{geração}.zip; leiaute lido na cópia 2026-02 (S16); trecho normativo
    que exige a compatibilidade ainda não localizado
  estado: PENDENTE
  proveniencia: SECUNDARIA
  confirmacao: A_CONFIRMAR
pressupostos:
  - >-
    Critério temporal documental por fonte NAO_RESOLVIDO: qual competência do SIGTAP vale para o
    registro depende de documento normativo pendente; B_ATEND e B_PROC são alternativas
    exploratórias e M_TEMP sem política documentada se abstém.
  - Leiaute de rl_procedimento_ocupacao SECUNDARIA (S16); A_CONFIRMAR.
  - Aplicabilidade a procedimentos sem ocupação listada A_CONFIRMAR; tratada como desconhecida.
  - Regra aplicada a todos os instrumentos listados; restrição por instrumento A_CONFIRMAR.

schema_id: agregados_registro.v1
descricao: >-
  Agregação por registro, espelho de AgregadoRegistro: violações, conformes, inconclusivas e não
  aplicáveis em listas separadas. ALERTA exige ao menos uma violação e vale mesmo com outra regra
  inconclusiva; ABSTENCAO é ausência de violação com ao menos uma inconclusiva ou nenhuma conforme
  (inclusive registro só com regras não aplicáveis ou sem regra avaliada); SEM_VIOLACAO_VERIFICADA
  exige ao menos uma conforme e nenhuma violação ou inconclusiva; não existe estado aprovado.
chave: [run_id, row_id]
colunas:
  - nome: run_id
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: Execução (RunResult.run_id).
  - nome: row_id
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: Registro avaliado.
  - nome: violacoes
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      rule_id com VIOLACAO, ordenados, sem repetição e unidos por ';'; texto vazio quando não há.
  - nome: conformes
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      rule_id com CONFORME, ordenados, sem repetição e unidos por ';'; texto vazio quando não há.
  - nome: inconclusivas
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      rule_id com INCONCLUSIVO, ordenados, sem repetição e unidos por ';'; texto vazio quando não
      há.
  - nome: nao_aplicaveis
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      rule_id com NAO_APLICAVEL, ordenados, sem repetição e unidos por ';'; texto vazio quando não
      há.
  - nome: resultado
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      ResultadoRegistro: ALERTA, SEM_VIOLACAO_VERIFICADA ou ABSTENCAO.

schema_id: piloto_exclusoes.v1
descricao: >-
  Linhas físicas do SIA-PA fora da população do relatório do piloto (T05), contadas por motivo de
  exclusão. Cada linha recebe no máximo um motivo, o primeiro que se aplica na ordem
  versoes_concorrentes (competência do arquivo com mais de uma versão de conteúdo numa parte),
  deletado, municipio_estabelecimento_ausente, fora_do_territorio,
  competencia_processamento_ausente, fora_do_intervalo_da_coorte e instrumento_fora_da_coorte. As
  demais são as incluídas: incluídas mais excluídas reconciliam com as linhas dos conjuntos
  sia_pa.v1. Tabela derivada do código do relatório (reporting/report_tabelas.py), sem leiaute
  oficial; exploratória pré-G0 e A_CONFIRMAR.
chave: [motivo]
colunas:
  - nome: motivo
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      Motivo de exclusão: o primeiro que se aplica, na ordem da descrição do esquema.
  - nome: linhas
    tipo: INTEIRO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: Linhas físicas do SIA-PA excluídas por esse motivo.

      - nome_fisico: DT_COMPETENCIA
        tipo_fisico: CHAR
        largura: "6"
        decimais: "0"
        nome_canonico: dt_competencia
        tipo_canonico: TEXTO
        papel: CHAVE
        obrigatorio: "true"
  - layout_id: sigtap.rl_procedimento_registro
    fonte: SIGTAP
    versao: "1"
    codificacao: latin-1
    formato: LARGURA_FIXA
    proveniencia: INFERIDA

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          version: "0.8.17"
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked
      - name: Ownership checked by the base branch checker
        if: github.event_name == 'pull_request'
        env:
          # Transição: o checador de bases anteriores ao PR-C deriva a raiz de __file__; com
          # GIT_DIR ele enxerga este checkout mesmo rodando de $RUNNER_TEMP.
          GIT_DIR: ${{ github.workspace }}/.git
        run: |
          git show "origin/${GITHUB_BASE_REF}:scripts/check_ownership.py" > "$RUNNER_TEMP/check_ownership.py"
          uv run python "$RUNNER_TEMP/check_ownership.py"
      - name: Lint, types, ownership and tests
        run: bash scripts/ci.sh

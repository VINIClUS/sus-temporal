    campos:
      - nome_fisico: CO_PROCEDIMENTO
        tipo_fisico: VARCHAR2
        largura: "10"
        decimais: "0"
        nome_canonico: co_procedimento
        tipo_canonico: TEXTO
        papel: CHAVE
        obrigatorio: "true"
      - nome_fisico: CO_REGISTRO
        tipo_fisico: VARCHAR2
        largura: "2"
        decimais: "0"

# Fontes do piloto (plano T02). Diretórios, nomes e partes vêm de fontes secundárias listadas em
# docs/references/fontes.md e NÃO foram verificados neste ambiente (FTP do DATASUS e *.gov.br
# bloqueados): proveniência SECUNDARIA ou OFICIAL_VISTO_EM_BUSCA, confirmação A_CONFIRMAR.
# Cada fonte é descoberta por listagem do diretório (a listagem é ela própria uma observação);
# nenhum nome é presumido. `padrao_nome` é uma expressão regular com {uf}, {aamm} e {aaaamm}
# substituídos e comparada sem distinguir maiúsculas; o AAMM do nome é a competência do arquivo
# (no SIA-PA, a de processamento: SECUNDARIA, inventário §1.1).
versao: "1"
fontes:
  - fonte: SIA_PA
    diretorio: ftp://ftp.datasus.gov.br/dissemin/publicos/SIASUS/200801_/Dados/
    padrao_nome: 'PA{uf}{aamm}(?P<parte>[a-z]|_[0-9]+)?\.dbc'
    formato: DBC
    canal: ATUAL
    multipartes: "true"
    tamanho_maximo_bytes: "2147483648"
    proveniencia: SECUNDARIA
    confirmacao: A_CONFIRMAR
    referencias: [O14, S2, S3, S5, S10, S11]
    observacao: >-
      SP dividido em partes a–d conforme o mês (inventário §1.2); todas as partes listadas são
      requisitadas, e parte ausente torna a competência INCOMPLETA na seleção.
  - fonte: CNES_ST
    diretorio: ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/ST/
    padrao_nome: 'ST{uf}{aamm}(?P<parte>[a-z]|_[0-9]+)?\.dbc'
    formato: DBC
    canal: ATUAL
    tamanho_maximo_bytes: "1073741824"
    proveniencia: SECUNDARIA
    confirmacao: A_CONFIRMAR
    referencias: [O14, S2, S3, S5, S10]
    observacao: SP não dividido segundo S10; partes, se listadas, são requisitadas.
  - fonte: CNES_PF
    diretorio: ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/PF/
    padrao_nome: 'PF{uf}{aamm}(?P<parte>[a-z]|_[0-9]+)?\.dbc'
    formato: DBC
    canal: ATUAL
    tamanho_maximo_bytes: "1073741824"
    proveniencia: SECUNDARIA
    confirmacao: A_CONFIRMAR
    referencias: [O14, S2, S3, S5, S10]
  - fonte: CNES_SR
    diretorio: ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/SR/
    padrao_nome: 'SR{uf}{aamm}(?P<parte>[a-z]|_[0-9]+)?\.dbc'
    formato: DBC
    canal: ATUAL
    tamanho_maximo_bytes: "1073741824"
    proveniencia: SECUNDARIA
    confirmacao: A_CONFIRMAR
    referencias: [O14, S2, S3, S5]
  - fonte: CNES_HB
    diretorio: ftp://ftp.datasus.gov.br/dissemin/publicos/CNES/200508_/Dados/HB/
    padrao_nome: 'HB{uf}{aamm}(?P<parte>[a-z]|_[0-9]+)?\.dbc'
    formato: DBC
    canal: ATUAL
    tamanho_maximo_bytes: "1073741824"
    proveniencia: SECUNDARIA
    confirmacao: A_CONFIRMAR
    referencias: [O14, S2, S3, S5]
  - fonte: SIGTAP
    diretorio: ftp://ftp2.datasus.gov.br/pub/sistemas/tup/downloads/
    padrao_nome: 'TabelaUnificada_{aaaamm}_v(?P<versao>[0-9]{10})\.zip'
    formato: ZIP
    canal: ATUAL
    tamanho_maximo_bytes: "536870912"
    proveniencia: SECUNDARIA
    confirmacao: A_CONFIRMAR
    referencias: [O11, S18, S19, W8]
    observacao: >-
      Sem UF. Cada geração (v{AAMMDDhhmm}) listada é requisitada e é uma chave própria na
      vigilância; a versão de conteúdo vem dos bytes (o artifact_id não usa a geração), então
      gerações com bytes iguais são a mesma versão. S19 usa /public/ no lugar de /pub/
      (A_CONFIRMAR qual diretório vale).

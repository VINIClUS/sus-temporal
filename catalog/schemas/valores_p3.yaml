schema_id: valores_p3.v1
descricao: >-
  Parcela identificada de valor de tabela não aprovado (P3, T13) por execução, estrato de
  rótulo e categoria. Uma única execução do motor (uma seleção de versões) define a
  população: cada registro avaliado é uma ocorrência, sem deduplicação, e cai em exatamente uma
  categoria do seu estrato (IDENTIFICADA_GOVERNANCA_MUNICIPAL,
  INCOMPATIBILIDADE_SEM_GOVERNANCA_DOCUMENTADA, ABSTENCAO_ELEGIVEL, SEM_VIOLACAO_VERIFICADA,
  DIFERENCA_NEGATIVA ou CAMPOS_INSUFICIENTES). DENOMINADOR soma d(r) das quatro primeiras
  categorias e NUMERADOR é a primeira; os recortes sobrepostos (ROTULO_CONTRADITORIO,
  INCONCLUSIVO e FAMILIA_<família>) e a RAZAO saem com aditiva falsa. d(r) é o valor apresentado
  menos o aprovado, somado em Decimal. Numerador e razão ficam nulos sem governança municipal
  documentada que cubra toda família violada. A razão não é perda financeira nem parcela de
  todas as perdas municipais. Esquema definido em evaluation/values.py, sem leiaute oficial;
  exploratório pré-G0 e A_CONFIRMAR. Rótulos e valores herdam a proveniência de sia_pa_rotulos.v1
  (SECUNDARIA; A_CONFIRMAR).
chave: [run_id, estrato, categoria]
colunas:
  - nome: run_id
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: Execução do motor (RunResult.run_id) cuja seleção de versões define a população.
  - nome: estrato
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      Rótulo do registro (CodigoRotulo de sia_pa_rotulos.v1, codebook SECUNDARIA); NAO_APROVADO
      e APROVADO_PARCIAL sempre aparecem, os demais só quando há registro.
  - nome: categoria
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      Categoria do estrato: as seis categorias da descrição do esquema, DENOMINADOR, NUMERADOR,
      ROTULO_CONTRADITORIO, INCONCLUSIVO, FAMILIA_<FamiliaRegra> ou RAZAO.
  - nome: aditiva
    tipo: BOOLEANO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      Falso nos recortes sobrepostos (ROTULO_CONTRADITORIO, INCONCLUSIVO e FAMILIA_*) e na RAZAO;
      verdadeiro nas demais linhas.
  - nome: ocorrencias
    tipo: INTEIRO
    papel: DIAGNOSTICO
    descricao: >-
      Registros da categoria, um por ocorrência; nula na RAZAO e no NUMERADOR indeterminado.
  - nome: valor_apresentado
    tipo: DECIMAL
    papel: DIAGNOSTICO
    descricao: >-
      Soma de valor_apresentado (PA_VALPRO) dos registros da categoria com valor conhecido, com 6
      casas; nula sem nenhum valor conhecido.
  - nome: valor_aprovado
    tipo: DECIMAL
    papel: DIAGNOSTICO
    descricao: >-
      Soma de valor_aprovado (PA_VALAPR) dos registros da categoria com valor conhecido, com 6
      casas; nula sem nenhum valor conhecido.
  - nome: diferenca
    tipo: DECIMAL
    papel: DIAGNOSTICO
    descricao: >-
      Soma de d(r) dos registros da categoria com os dois valores conhecidos, com 6 casas; nula
      sem nenhum.
  - nome: razao
    tipo: DECIMAL
    papel: DIAGNOSTICO
    descricao: >-
      NUMERADOR sobre DENOMINADOR em diferenca, com 12 casas, só na linha RAZAO de NAO_APROVADO e
      APROVADO_PARCIAL; nula se indeterminada ou com denominador não positivo.

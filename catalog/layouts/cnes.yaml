# Leiautes do CNES (PF{UF}{AAMM}.dbc e ST{UF}{AAMM}.dbc), um LayoutSpec por grupo.
# O leitor confere nome, ordem, tipo, largura e decimais com rigor (ADR 0002): divergência vai para
# QUARENTENA_LEIAUTE, nunca para leitura aproximada.
# PF: 40 campos observados e impostos pelo CnesData (EMPIRICA_CNESDATA, S33), registrados aqui como
# SECUNDARIA; competências observadas não registradas, validade para 2018–2025 A_CONFIRMAR em O7 e
# nos cabeçalhos reais. Só CNES, CBO e COMPETEN são retidos, como contagens por
# estabelecimento–CBO (cnes_estab_cbo.v1); CPF, CNS, nome, registro em conselho, residência e os
# demais campos são lidos só para conferir o leiaute e nunca saem do leitor. As sentinelas de
# CPF_PROF e CNS_PROF (noves) são as do CnesData (EMPIRICA_CNESDATA) e ficam só documentadas.
# ST: leiaute desconhecido (A_CONFIRMAR em O7). Os nomes abaixo foram INFERIDA do PF; arquivos
# reais irão para quarentena até a confirmação contra o cabeçalho real (docs/pendencias/T04.md).
# SR e HB pertencem a famílias reservadas (catalog/familias.yaml) e não têm leiaute nem esquema.
leiautes:
  - layout_id: cnes.pf
    fonte: CNES_PF

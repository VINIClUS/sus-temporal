schema_id: falhas.v1
descricao: >-
  Falhas operacionais por execução, espelho de FalhaOperacional: erro de programa registrado à
  parte, nunca convertido em estado de avaliação nem em resultado científico.
chave: [run_id, sequencia]
colunas:
  - nome: run_id
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: Execução (RunResult.run_id).
  - nome: sequencia
    tipo: INTEIRO
    papel: CHAVE
    anulavel: false
    descricao: Ordem de registro da falha na execução, a partir de 1.
  - nome: etapa
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: Etapa do processamento em que a falha ocorreu.
  - nome: row_id
    tipo: TEXTO
    papel: LINHAGEM
    descricao: Registro afetado, quando houver.
  - nome: rule_id
    tipo: TEXTO
    papel: DIAGNOSTICO
    descricao: Regra afetada, quando houver.
  - nome: erro
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: Mensagem de erro no formato chave=valor.
  - nome: ocorrida_em
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: Instante UTC em ISO 8601 (InstanteUTC).

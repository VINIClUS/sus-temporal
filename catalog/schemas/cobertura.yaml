schema_id: cobertura.v1
descricao: >-
  Matriz de cobertura família × instrumento × competência (plano T04): indica se as fontes e os
  campos exigidos pela família em catalog/familias.yaml estão disponíveis para os registros daquele
  instrumento e competência. Fonte carregada não implica família verificável; INSUFICIENTE e AUSENTE
  levam a inconclusão, nunca a violação.
chave: [familia_regra, instrumento, competencia]
colunas:
  - nome: familia_regra
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: FamiliaRegra de catalog/familias.yaml.
  - nome: instrumento
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      Instrumento PA_DOCORIG: C, I, P, S, A ou B.
  - nome: competencia
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: Competência de processamento AAAAMM dos registros SIA-PA.
  - nome: estado
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      EstadoCobertura: DISPONIVEL, INSUFICIENTE ou AUSENTE.
  - nome: motivo
    tipo: TEXTO
    papel: DIAGNOSTICO
    descricao: Fonte, campo ou versão que falta quando o estado não é DISPONIVEL; nulo quando é.

# Análise automática do SonarCloud: separa código de produção e de teste, como no CnesData.
# Não ignora regras; supressão, quando houver, é escopada por regra + caminho e justificada.
sonar.sources=src,scripts,.claude/hooks,.github,catalog,config
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=**/__pycache__/**,docs/**
sonar.python.version=3.12
# python:S5332 (protocolo sem criptografia) só no transporte de aquisição: o DATASUS publica os
# dados por FTP (o HTTPS é instável); a integridade é conferida pelo sha256 registrado, por
# checagens físicas e por quarentena. Hipótese não verificada (que o gate acusa essa regra nesse
# arquivo), porque a lista de issues está invisível (issue #5). Revisar em 2026-12-31.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=src/sustemporal/acquisition/transport.py

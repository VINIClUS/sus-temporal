# Análise automática do SonarCloud: separa código de produção e de teste, como no CnesData.
# Não ignora regras; supressão, quando houver, é escopada por regra + caminho e justificada.
sonar.sources=src,scripts,.claude/hooks,.github,catalog,config
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.exclusions=**/__pycache__/**,docs/**
sonar.python.version=3.12

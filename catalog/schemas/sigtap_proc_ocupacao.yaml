schema_id: sigtap_proc_ocupacao.v1
descricao: >-
  Relação procedimento–ocupação do SIGTAP (rl_procedimento_ocupacao): uma linha por competência,
  procedimento, CBO e versão de conteúdo de cada zip TabelaUnificada_{AAAAMM}_v{geração}.zip (O10,
  O11), arquivo de largura fixa em ISO-8859-1 lido com o *_layout.txt do próprio zip. A relação é um
  conjunto; duplicatas exatas do arquivo entram na reconciliação. Leiaute 2026-02 CO_PROCEDIMENTO
  1–10, CO_OCUPACAO 11–16, DT_COMPETENCIA 17–22 (S16, SECUNDARIA); A_CONFIRMAR.
chave: [dt_competencia, co_procedimento, co_ocupacao, artifact_id]
colunas:
  - nome: dt_competencia
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      DT_COMPETENCIA: competência AAAAMM da tabela.
  - nome: co_procedimento
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      CO_PROCEDIMENTO: procedimento, 10 dígitos com zeros à esquerda.
  - nome: co_ocupacao
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      CO_OCUPACAO: CBO, 6 caracteres [0-9A-Z].
  - nome: artifact_id
    tipo: TEXTO
    papel: LINHAGEM
    anulavel: false
    descricao: Versão de conteúdo do zip da Tabela Unificada.

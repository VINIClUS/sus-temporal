schema_id: cobertura.v1
descricao: >-
  Matriz de cobertura família × instrumento × competência × base temporal (plano T04): indica se as
  fontes e os campos exigidos pela família em catalog/familias.yaml estão disponíveis para os
  registros daquele instrumento e competência quando as fontes auxiliares são escolhidas por aquela
  base temporal; o mesmo lote pode exigir competências auxiliares diferentes em B_ATEND e B_PROC.
  Fonte carregada não implica família verificável; INSUFICIENTE e AUSENTE levam a inconclusão, nunca
  a violação.
chave: [familia_regra, instrumento, competencia, base_temporal]
colunas:
  - nome: familia_regra
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: FamiliaRegra de catalog/familias.yaml.
  - nome: instrumento
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      Instrumento PA_DOCORIG: C, I, P, S, A ou B.
  - nome: competencia
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: Competência de processamento AAAAMM dos registros SIA-PA.
  - nome: base_temporal
    tipo: TEXTO
    papel: CHAVE
    anulavel: false
    descricao: >-
      BaseTemporal que escolhe as competências das fontes auxiliares: ATENDIMENTO (B_ATEND) ou
      PROCESSAMENTO (B_PROC).
  - nome: estado
    tipo: TEXTO
    papel: DIAGNOSTICO
    anulavel: false
    descricao: >-
      EstadoCobertura: DISPONIVEL, INSUFICIENTE ou AUSENTE.
  - nome: motivo
    tipo: TEXTO
    papel: DIAGNOSTICO
    descricao: Fonte, campo ou versão que falta quando o estado não é DISPONIVEL; nulo quando é.

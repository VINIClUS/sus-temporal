# Leiaute do SIA-PA (PA{UF}{AAMM}[parte].dbc), um LayoutSpec por linha de campo físico.
# Proveniência: ordem das posições 14, 15 e 50-53 SECUNDARIA (transcrição do IT SIASUS 2019-07,
# fontes S6-S8); demais posições INFERIDA (sequência do microdatasus, S1). Tipos dBASE, larguras e
# decimais são INFERIDA (nenhuma fonte disponível os confirma): o leitor confere nome, ordem, tipo,
# largura e decimais com rigor (ADR 0002), então arquivos reais vão para QUARENTENA_LEIAUTE até a
# confirmação contra cabeçalhos reais (docs/pendencias/T03.md).
# Variação aceita: os campos com obrigatorio "false" (posições 55-60, que levaram o PA de 54 a 60
# colunas segundo S4, e PA_FNTORC, presente em arquivos de 2026 segundo S9) podem faltar; quando
# presentes, aparecem na ordem abaixo. Campo físico sem coluna em sia_pa.v1 (PA_CNPJCPF,
# PA_CNPJMNT, PA_CNPJ_CC, PA_AUTORIZ, PA_CNSMED, PA_FNTORC) é lido para conferir o leiaute e
# descartado por minimização ou por falta de semântica; o descarte é registrado no log da ingestão.
# Sentinelas (SECUNDARIA, S1; A_CONFIRMAR): valor bruto aparado -> motivo de ausência.
# PA_IDADE: unidade ANOS segundo transcrições do IT (SECUNDARIA; A_CONFIRMAR); 999 tratado como
# sentinela de idade não informada (INFERIDA; A_CONFIRMAR).

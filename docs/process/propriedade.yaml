# Propriedade de arquivos por sessão. Checada no CI por scripts/check_ownership.py, que lê
# este arquivo a partir da base do PR (um branch não altera as regras que o julgam); no PR, o
# próprio checador também é extraído da base.
# Padrões fnmatch: "*" também atravessa "/". Ordem de checagem: somente_humanos (sem
# diferenciar caixa; exceções diferenciam) → integradores (podem tudo, exceto o que é só
# humano) → reservados_integradores (nome de arquivo em qualquer pasta) → caminhos próprios →
# caminhos de outro dono → compartilhado.
# Branch sem dono: em PR reprova, salvo humanos.branches; fora de PR, só claude/* reprova.
# src/, catalog/ e config/ são fechados: o que não é de uma sessão é do orquestrador.
versao: 1
integradores: ["ORQ"]
humanos:
  branches: ["humano/*"]
reservados_integradores:
  - "pyproject.toml"
  - "uv.lock"
  - "ruff.toml"
  - ".ruff.toml"
  - "conftest.py"
  - "pytest.ini"
  - "setup.cfg"
  - "setup.py"
  - "tox.ini"
  - "mypy.ini"
  - ".mypy.ini"
  - ".coveragerc"
  - "sitecustomize.py"
  - "usercustomize.py"
  - ".python-version"
  - "pytest.toml"
  - ".pytest.toml"
  - ".pytest.ini"
  - "uv.toml"
  - "pyrightconfig.json"
  - ".pre-commit-config.yaml"
  - "noxfile.py"
  - ".sonarcloud.properties"
  - "sonar-project.properties"
